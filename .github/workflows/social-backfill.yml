name: Social Multi-Channel Backfill Scheduler

on:
  schedule:
    # Chạy mỗi 4 giờ một lần (08:00, 12:00, 16:00, 20:00, 00:00, 04:00 giờ Việt Nam UTC+7)
    # Tương ứng UTC: 01:00, 05:00, 09:00, 13:00, 17:00, 21:00
    - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công trên GitHub Actions
  repository_dispatch:
    types: [social_backfill, run_backfill]

jobs:
  backfill:
    name: Tự Động Đăng Bài Viết Cũ Theo Hàng Đợi (Backfill)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kích hoạt Lượt Đăng Tiếp Theo Trong Hàng Đợi
        env:
          APP_URL: https://www.betongangiabinh.vn
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8876120939:AAEpkh1zZKQu6bq23eLv5gE_encPuFFhsCc' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8612893214' }}
        run: node scripts/run-social-backfill.mjs
