name: AI Daily Auto-Pilot Publisher (Social Listening & Scheduler)

on:
  schedule:
    # Chạy 3 lần mỗi ngày vào 06:00, 12:00, 18:00 giờ Việt Nam (UTC+7)
    # Tương ứng UTC: 23:00 (hôm trước), 05:00, 11:00 UTC
    - cron: '0 23,5,11 * * *'
  workflow_dispatch: # Cho phép Admin kích hoạt thủ công trên GitHub bất cứ lúc nào

jobs:
  auto-publish:
    name: Quét Tin Tức & Tự Động Xuất Bản Chuẩn SEO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm ci

      - name: Chạy Auto-Pilot Social Listening & Auto Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/run-daily-autopilot.mjs
